<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Snake Game 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High score:
                        <span id ="high-score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Score:
                        <span id ="score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Time:
                        <span id ="time">00-00</span>
                    </h3>
                </div>
            </div>
            <div class="board"></div>

            <div class="touch-controls">
                <button class="btn-dir" data-dir="up" aria-label="Move up">&#9650;</button>
                <div class="touch-controls-row">
                    <button class="btn-dir" data-dir="left" aria-label="Move left">&#9664;</button>
                    <button class="btn-dir" data-dir="down" aria-label="Move down">&#9660;</button>
                    <button class="btn-dir" data-dir="right" aria-label="Move right">&#9654;</button>
                </div>
            </div>
        </section>
        <div class="modal">
            <div class="start-game">
                <h3>welcome to snake game</h3>
                <button class="btn btn-start">Start Game</button>
            </div>
            <div class="game-over">
                <h3>Game Over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
